<div
  class="carousel"
  role="region"
  aria-roledescription="carrusel"
  aria-label="Imágenes destacadas"
  (mouseenter)="pauseAutoplay()"
  (mouseleave)="resumeAutoplay()"
>
  <div class="carousel__track" [style.transform]="'translateX(-' + activeIndex() * 100 + '%)'">
    @for (slide of slides; track slide.src; let i = $index) {
      <img
        class="carousel__slide"
        [src]="slide.src"
        [alt]="slide.alt"
        [loading]="i === 0 ? 'eager' : 'lazy'"
        [attr.fetchpriority]="i === 0 ? 'high' : null"
      />
    }
  </div>

  @if (slides.length > 1) {
    <button type="button" class="carousel__arrow carousel__arrow--prev" aria-label="Imagen anterior" (click)="prev()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <button type="button" class="carousel__arrow carousel__arrow--next" aria-label="Imagen siguiente" (click)="next()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <div class="carousel__dots">
      @for (slide of slides; track slide.src; let i = $index) {
        <button
          type="button"
          class="carousel__dot"
          [class.carousel__dot--active]="i === activeIndex()"
          [attr.aria-current]="i === activeIndex() ? 'true' : null"
          [attr.aria-label]="'Ir a la imagen ' + (i + 1)"
          (click)="goTo(i)"
        ></button>
      }
    </div>
  }
</div>
