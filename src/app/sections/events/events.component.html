<section class="events" id="eventos">
  <div class="events__container">
    <div class="events__head">
      <div>
        <p class="events__kicker">Eventos</p>
        <h2 class="events__title">Agenda ecuestre <em>siempre actualizada</em></h2>
      </div>
      <a class="btn btn--secondary" href="#eventos">Ver todos los eventos</a>
    </div>

    <div class="events__grid">
      @for (event of events; track event.title) {
        <article class="events__card">
          <div class="events__media">
            <img class="events__card-image" [src]="event.image" [alt]="event.title" loading="lazy" />
            <span class="events__date">{{ event.date }}</span>
          </div>
          <div class="events__card-body">
            <h3 class="events__card-title">{{ event.title }}</h3>
            <p class="events__place">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z" />
                <circle cx="12" cy="9.5" r="2.5" />
              </svg>
              {{ event.place }}
            </p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
