<header class="header">
  <div class="header__bar">
    <a class="brand" href="#top">
      <span class="brand__icon" aria-hidden="true">
        <img src="images/logo.png" alt="Equestris" width="90%" height="90%" />
      </span>
      <span class="brand__text">
        <span class="brand__name">EQUESTRIS</span>
        <span class="brand__tagline">El mundo ecuestre conectado</span>
      </span>
    </a>

    <nav class="nav nav--desktop" aria-label="Navegación principal">
      @for (link of navLinks; track link.href) {
        <a class="nav__link" [href]="link.href">{{ link.label }}</a>
      }
    </nav>

    <div class="header__actions">
      <button
        type="button"
        class="icon-btn icon-btn--outline nav--desktop"
        aria-label="Buscar"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6" />
          <path d="M20 20l-4.3-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
      <button type="button" class="icon-btn icon-btn--gold nav--desktop" aria-label="Perfil">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4.5 13.5c0-4.7 3.4-8.5 7.5-8.5s7.5 3.8 7.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M3.5 14c0-.7.6-1.3 1.3-1.3h14.4c.7 0 1.3.6 1.3 1.3v.4c0 1-.8 1.8-1.8 1.8H5.3c-1 0-1.8-.8-1.8-1.8V14z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M12 5v2.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
      <button
        type="button"
        class="menu-toggle"
        aria-label="Abrir menú"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav class="nav nav--mobile" aria-label="Navegación móvil">
      @for (link of navLinks; track link.href) {
        <a class="nav__link" [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
      }
    </nav>
  }
</header>
